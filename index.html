<script>
const $=id=>document.getElementById(id);
const TFM={'1m':6e4,'5m':3e5,'15m':9e5,'30m':18e5,'1h':36e5,'4h':144e5,'1d':864e5,'1w':6048e5,'1M':2592e6};
/* cascade, top to bottom: each POI must sit inside the one above it */
const CAS_TF=['1M','1w','1d','4h','1h','30m','15m','5m','1m'];
const LBL={'1M':'1MO','1w':'1W','1d':'1D','4h':'4H','1h':'1H','30m':'30M','15m':'15M','5m':'5M','1m':'1M'};
const FEEDS={GOLD:{s:'PAXGUSDT',n:'GOLD · PAXG/USDT'},BTC:{s:'BTCUSDT',n:'BTC/USD · BTCUSDT'},ETH:{s:'ETHUSDT',n:'ETH · ETH/USDT'},XRP:{s:'XRPUSDT',n:'XRP · XRP/USDT'},DOGE:{s:'DOGEUSDT',n:'DOGE · DOGE/USDT'},ADA:{s:'ADAUSDT',n:'ADA · ADA/USDT'},TRX:{s:'TRXUSDT',n:'TRX · TRX/USDT'},SHIB:{s:'SHIBUSDT',n:'SHIB · SHIB/USDT'}};
const REST=['https://data-api.binance.vision','https://api.binance.com'],WSU='wss://stream.binance.com:9443/ws/';
const UP='#00e676',DN='#ff3b3b',COL={ob:'#3b82f6',bb:'#8b5cf6',up:'#10b981',dn:'#ef4444',crt:'#d946ef',cas:'#a855f7'};
/* EXTERNAL STRUCTURE ONLY: a swing needs EXT candles on each side. ZZMIN = smallest zigzag leg in ATR. */
const EXT=8,ZZMIN=2;
const on={ZZ:1,VP:1,SMC:1,OB:1,BB:1,'S/D':1,CRT:1,OF:1,AOnly:1,CAS:1,SIG4:1};
const CH={ZZ:'ZigZag (external range liquidity)',VP:'Volume Profile (line panel)',SMC:'SMC',OB:'OB',BB:'BB','S/D':'Supply/Demand',CRT:'CRT (D1)',OF:'Order Flow',AOnly:'A+ setups only',CAS:'POI cascade 1MO→1m',SIG4:'4H BUY/SELL signal (4H and below)'};
const KN={OB:'Order Block',BB:'Breaker Block','S/D':'Supply/Demand'};
/* old per-timeframe ATR BUY/SELL labels are off: the 4H signal is the only buy/sell indicator */
const SHOW_ATR=false;
let asset='GOLD',tf='15m',src='api',BASE=[],bm=60,label='',C=[],A={},CASC=null,CASERR='',MTF={},SCAN='',sty=0,off=0,vis=100,pshift=0;
let ws=null,gen=0,rt=null,live=true,seq=0,cseq=0,raf=0;
/* signal speed: false = Close (closed 4H candles only), true = Live (also the forming 4H candle, faster but can change) */
let FAST=false;
let replay=false,replayT=null,rIdx=0,rPlay=false,rTimer=null,rSpeed=1,FULL=[];
let cross=null,V={R:1,B:1,cw:1,last:0,mn:0,mx:1},Wd=0,Ht=0,LW=0,LH=0;
const fmt=p=>Number.isFinite(p)?(p>=100?p.toFixed(2):p>=1?p.toFixed(3):p.toFixed(6)):'--';
const fmtV=v=>{const a=Math.abs(v),s=v<0?'-':'+';return s+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'k':a.toFixed(2))};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const setSt=m=>{$('st').textContent=m};const dot=c=>{$('dot').style.background=c};
const tlab=t=>{const d=new Date(t);return TFM[tf]>=864e5?`${d.getMonth()+1}/${d.getDate()}`:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

/* ---------- DATA ---------- */
function resample(a,m){if(m<=bm)return a;const ms=m*6e4,o=[];let c=null;
for(const k of a){const b=Math.floor(k.t/ms)*ms;if(!c||c.t!==b){c={t:b,o:k.o,h:k.h,l:k.l,c:k.c,v:k.v,b:k.b};o.push(c)}else{c.h=Math.max(c.h,k.h);c.l=Math.min(c.l,k.l);c.c=k.c;c.v+=k.v;c.b+=k.b}}return o}
async function fetchKlines(sym,t,min=80){
 for(const b of REST){
  try{const r=await fetch(`${b}/api/v3/klines?symbol=${sym}&interval=${t}&limit=1000`,{cache:'no-store'});
   if(!r.ok)continue;const k=await r.json();if(!Array.isArray(k)||k.length<min)continue;
   return k.map(q=>({t:+q[0],o:+q[1],h:+q[2],l:+q[3],c:+q[4],v:+q[5],b:+q[9]}))}catch(e){}
 }
 return null;
}
async function loadData(){
 const my=++seq;stopFeed();C=[];A={};CASC=null;off=0;pshift=0;
 if(src==='csv'){C=resample(BASE,TFM[tf]/6e4);return done()}
 $('sym').textContent=FEEDS[asset].n;setSt('Loading real data...');dot('#475569');
 const k=await fetchKlines(FEEDS[asset].s,tf);
 if(my!==seq)return;
 if(k){C=k;return done()}
 setSt('No feed');dot('#ef4444');draw();
 $('info').innerHTML='<div class="box"><b class="dn">Real feed unavailable</b><div class="mu">This page cannot reach Binance (open the file directly in a browser, not from a sandboxed preview). You can also load real candles with the CSV button. No fake candles are generated.</div></div>';
}
function done(){loadCascade();analyze();draw();if(FAST)connect4h();setSt(src==='csv'?label:'Real data · '+tf);dot(src==='csv'?'#f59e0b':'#10b981');if(live&&src==='api')connect()}
function stopFeed(){gen++;clearTimeout(rt);rt=null;if(ws){ws.onopen=ws.onmessage=ws.onerror=ws.onclose=null;try{ws.close()}catch(e){}ws=null}}
function connect(){
 stopFeed();if(src!=='api'||!live||replay)return;const g=gen;
 try{ws=new WebSocket(WSU+FEEDS[asset].s.toLowerCase()+'@kline_'+tf)}catch(e){return}
 ws.onopen=()=>{if(g===gen){setSt('LIVE · '+tf);dot('#10b981')}};
 ws.onmessage=e=>{if(g!==gen||replay)return;try{const k=JSON.parse(e.data).k;if(!k)return;
  const c={t:+k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v,b:+k.V},L=C[C.length-1];
  if(L&&L.t===c.t)C[C.length-1]=c;else{C.push(c);if(off>0)off++;if(C.length>1500)C.shift()}
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;analyze();draw()})}catch(x){}};
 ws.onclose=()=>{if(g!==gen||!live)return;dot('#ef4444');setSt('Reconnecting...');rt=setTimeout(()=>{if(g===gen)connect()},3000)};
 ws.onerror=()=>{try{ws.close()}catch(e){}};
}
/* cascade timeframes: the chart timeframe always comes from C, the rest from MTF */
async function loadCascade(){
 if(src!=='api')return;
 const my=++cseq,sym=FEEDS[asset].s;
 const res=await Promise.all(CAS_TF.map(t=>fetchKlines(sym,t,20)));
 if(my!==cseq)return;
 if(res.some(r=>!r)){CASERR='Could not load every cascade timeframe (1M to 1MO) from Binance.';CASC=null;info();return}
 CAS_TF.forEach((t,i)=>MTF[t]=res[i]);CASERR='';
 analyze();if(SHOWBT)BT=backtest();draw();info();
}
setInterval(()=>{if(!replay&&src==='api')loadCascade()},60000);
/* candles of one timeframe closed by the time shown on the chart (replay-safe, no look-ahead) */
function series(t){
 if(t===tf)return C;
 const d=MTF[t]||[];
 if(replayT==null)return d;
 const end=replayT+TFM[tf];let k=d.length;while(k>0&&d[k-1].t+TFM[t]>end)k--;return d.slice(0,k);
}

/* ---------- SMC + CRT ENGINE (external structure only, no look-ahead) ---------- */
function session(t){const h=new Date(t).getUTCHours();return h>=13&&h<21?['New York','Distribution']:h>=7&&h<13?['London','Manipulation']:['Asian','Consolidation']}
function analyze(){
 if(C.length<60){A={};CASC=null;info();return}
 try{A=engine(replay?C:C.slice(0,-1),C[C.length-1].c);topDown();buySignals();A.sg=atrSig(replay?C:C.slice(0,-1))}catch(e){console.error(e);A={}}
 try{CASC=cascade(C[C.length-1].c)}catch(e){console.error(e);CASC=null}
 try{calcSig4()}catch(e){console.error(e);S4=s4Empty()}
 info();
}
/* ATR reversal signal: a swing is confirmed when price reverses by ATR x mult from its extreme; BUY at the low, SELL at the high */
const SENS=[{n:'Low',m:3},{n:'Medium',m:2},{n:'High',m:1.2}];let sens=1;
function atrSig(c){
 const n=c.length;if(n<30)return null;const m=SENS[sens].m,atr=[];
 for(let i=0;i<n;i++){let t=0,q=0;for(let j=Math.max(1,i-13);j<=i;j++){t+=Math.max(c[j].h-c[j].l,Math.abs(c[j].h-c[j-1].c),Math.abs(c[j].l-c[j-1].c));q++}atr.push(q?t/q:c[i].h-c[i].l)}
 let tr=0,hP=c[0].h,hI=0,lP=c[0].l,lI=0;const sg=[];
 for(let i=1;i<n;i++){const th=m*atr[i],k=c[i];
  if(tr===0){if(k.h>hP){hP=k.h;hI=i}if(k.l<lP){lP=k.l;lI=i}
   if(k.h-lP>=th&&lI<i){sg.push({t:'BUY',i:lI,p:lP,c:i});tr=1;hP=k.h;hI=i}
   else if(hP-k.l>=th&&hI<i){sg.push({t:'SELL',i:hI,p:hP,c:i});tr=-1;lP=k.l;lI=i}}
  else if(tr===1){if(k.h>hP){hP=k.h;hI=i}else if(hP-k.l>=th){sg.push({t:'SELL',i:hI,p:hP,c:i});tr=-1;lP=k.l;lI=i}}
  else{if(k.l<lP){lP=k.l;lI=i}else if(k.h-lP>=th){sg.push({t:'BUY',i:lI,p:lP,c:i});tr=1;hP=k.h;hI=i}}}
 return{sg,tr,atr:atr[n-1],th:m*atr[n-1],m,n:SENS[sens].n};
}
/* top-down: every higher timeframe must share one trend; POIs and setups must match it */
function htfDir(){
 if(src!=='api')return null;
 const price=C[C.length-1].c,memo={};let d=null;
 for(const t of CAS_TF){
  if(TFM[t]<=TFM[tf])break;
  const E=engAt(t,price,memo);
  if(!E||!E.trend)return 0;
  if(d===null)d=E.trend;else if(E.trend!==d)return 0;
 }
 return d;
}
function topDown(){
 const d=htfDir();if(d===null||!A.Z)return;
 const p=C[C.length-1].c;
 A.Z=A.Z.filter(z=>z.d===d);
 A.setups=A.setups.filter(s=>s.d===d);
 A.inZone=A.Z.filter(z=>p>=z.lo&&p<=z.hi).length;
 A.htf=d;
}
/* BUY signal: trend and top-down bullish, a closed candle wicks into a bullish A/A+ POI and closes back above it */
function buySignals(){
 A.buys=[];
 if(!A.Z||A.trend!==1||(A.htf!=null&&A.htf!==1))return;
 const n=replay?C.length:C.length-1;
 for(let j=Math.max(1,n-2);j<n;j++){const k=C[j];
  const z=A.Z.find(q=>q.d===1&&q.from<j&&k.l<=q.hi&&k.l>=q.lo-.25*A.a&&k.c>q.hi&&k.c>k.o);
  if(!z)continue;
  if(A.of&&A.of.ok&&2*k.b-k.v<0)continue;
  A.buys.push({i:j,z,p:k.l});
 }
}
/* external range liquidity: a swing high must be the highest high, and a swing low the lowest low,
   within 20 candles on each side. Smaller swings inside that range are internal and are not drawn. */
function extOnly(c,n,p){
 const W=20,lo=Math.max(0,p.i-W),hi=Math.min(n-1,p.i+W);
 for(let j=lo;j<=hi;j++){if(j===p.i)continue;
  if(p.t===1&&c[j].h>=c[p.i].h)return false;
  if(p.t===-1&&c[j].l<=c[p.i].l)return false}
 return true;
}
function engine(c,lp,all){
 const n=c.length;let a=0;
 for(let i=n-14;i<n;i++)a+=Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c));a/=14;
 const N=EXT,ph={},pl={},sh=[],sl=[];
 for(let i=N;i<n-N;i++){let H=1,L=1;
  for(let j=1;j<=N;j++){if(c[i].h<=c[i-j].h||c[i].h<=c[i+j].h)H=0;if(c[i].l>=c[i-j].l||c[i].l>=c[i+j].l)L=0}
  if(H){ph[i]=c[i].h;sh.push({i,p:c[i].h})}if(L){pl[i]=c[i].l;sl.push({i,p:c[i].l})}}
 const bd=i=>Math.abs(c[i].c-c[i].o);
 const ar=i=>{let t=0,m=0;for(let j=Math.max(1,i-14);j<i;j++){t+=c[j].h-c[j].l;m++}return m?t/m:a};
 const zb=m=>{const hi=Math.max(c[m].o,c[m].c),lo=Math.min(c[m].o,c[m].c);return hi-lo<.15*a?{hi:c[m].h,lo:c[m].l}:{hi,lo}};
 let trend=0,lh=null,ll=null,has=false;const ev=[],obs=[];
 for(let i=0;i<n;i++){
  const k=i-N;if(k>=0&&ph[k]!=null)lh={i:k,p:ph[k],u:0};if(k>=0&&pl[k]!=null)ll={i:k,p:pl[k],u:0};
  const di=i>0&&bd(i-1)>bd(i)?i-1:i,dsp=bd(di)>1.2*ar(i);
  if(lh&&!lh.u&&c[i].c>lh.p){const t=!has?'CHoCH':trend===-1?(dsp?'MSS':'CHoCH'):'BOS';
   ev.push({d:1,t,p:lh.p,a:lh.i,b:i});let m=lh.i;for(let j=lh.i;j<=i;j++)if(c[j].l<c[m].l)m=j;
   obs.push({d:1,i:m,...zb(m),from:i,dsp});trend=1;has=true;lh.u=1}
  if(ll&&!ll.u&&c[i].c<ll.p){const t=!has?'CHoCH':trend===1?(dsp?'MSS':'CHoCH'):'BOS';
   ev.push({d:-1,t,p:ll.p,a:ll.i,b:i});let m=ll.i;for(let j=ll.i;j<=i;j++)if(c[j].h>c[m].h)m=j;
   obs.push({d:-1,i:m,...zb(m),from:i,dsp});trend=-1;has=true;ll.u=1}
 }
 const bre=(z,f)=>{for(let j=f+1;j<n;j++){if(z.d===1&&c[j].c<z.lo)return j;if(z.d===-1&&c[j].c>z.hi)return j}return -1};
 const fresh=(z,f)=>{for(let j=f+1;j<n-2;j++)if(c[j].l<=z.hi&&c[j].h>=z.lo)return false;return true};
 const mid0=z=>(z.hi+z.lo)/2;
 const near=(arr,k)=>[1,-1].flatMap(d=>arr.filter(z=>z.d===d).sort((u,v)=>Math.abs(lp-mid0(u))-Math.abs(lp-mid0(v))).slice(0,all?1e9:(k||2)));
 const lastH=sh[sh.length-1],lastL=sl[sl.length-1],eq=lastH&&lastL?(lastH.p+lastL.p)/2:null;
 const OB=near(obs.filter(z=>n-z.from<150&&z.dsp&&z.hi-z.lo<=1.5*a&&bre(z,z.from)<0&&fresh(z,z.from)&&(eq==null||(z.d===1?mid0(z)<eq:mid0(z)>eq))));
 const bbc=[];obs.forEach(z=>{const j=bre(z,z.from);if(j<0||!z.dsp||z.hi-z.lo>1.5*a||n-j>=150)return;
  const b={d:-z.d,i:z.i,hi:z.hi,lo:z.lo,from:j,dsp:true};if(bre(b,j)<0)bbc.push(b)});
 const BB=near(bbc,1);
 const sd=[];for(let i=1;i<n-1;i++){const r=c[i].h-c[i].l,b=c[i+1].c-c[i+1].o;
  if(r<.8*a&&Math.abs(b)>1.5*a)sd.push({d:b>0?1:-1,i,hi:c[i].h,lo:c[i].l,from:i+1,dsp:true})}
 const SD=near(sd.filter(z=>n-z.from<150&&z.hi-z.lo<=a&&bre(z,z.from)<0&&fresh(z,z.from)));
 /* CRT: D1 only. C2 sweeps the C1 high/low and closes back inside the C1 range */
 const days=[];for(let i=0;i<n;i++){const d=Math.floor(c[i].t/864e5),L=days[days.length-1];
  if(!L||L.d!==d)days.push({d,h:c[i].h,l:c[i].l,c:c[i].c,i0:i});else{L.h=Math.max(L.h,c[i].h);L.l=Math.min(L.l,c[i].l);L.c=c[i].c}}
 let CRT=null;
 for(let k=days.length-1;k>=Math.max(1,days.length-3)&&!CRT;k--){const p=days[k-1],q=days[k];
  if(q.h>p.h&&q.c<p.h&&q.c>p.l)CRT={d:-1,hi:p.h,lo:p.l,i0:p.i0,live:k===days.length-1};
  else if(q.l<p.l&&q.c>p.l&&q.c<p.h)CRT={d:1,hi:p.h,lo:p.l,i0:p.i0,live:k===days.length-1}}
 /* ORDER FLOW: delta = taker-buy minus taker-sell volume, CVD = running total. Needs real taker data (off for CSV). */
 const dl=c.map(k=>2*k.b-k.v),cvd=[];let cs=0;dl.forEach(v=>{cs+=v;cvd.push(cs)});
 const OK=dl.some(v=>Math.abs(v)>1e-9);
 const avg=(f,i)=>{let t=0,m=0;for(let j=Math.max(0,i-20);j<i;j++){t+=f(j);m++}return m?t/m:0};
 const avgD=i=>avg(j=>Math.abs(dl[j]),i),avgV=i=>avg(j=>c[j].v,i);
 let divH=null,divL=null,absn=null;
 if(OK){
  if(sh.length>1){const p=sh[sh.length-2],q=sh[sh.length-1];if(n-q.i<120&&q.p>p.p&&cvd[q.i]<cvd[p.i])divH={d:-1,i1:p.i,p1:p.p,i2:q.i,p2:q.p}}
  if(sl.length>1){const p=sl[sl.length-2],q=sl[sl.length-1];if(n-q.i<120&&q.p<p.p&&cvd[q.i]>cvd[p.i])divL={d:1,i1:p.i,p1:p.p,i2:q.i,p2:q.p}}

/* ---------- 4H SIGNAL ----------
   The BUY/SELL signal is made on the 4H chart only (ATR reversal on closed 4H candles).
   The same signal is shown, unchanged, on the 4H, 1H, 30M, 15M, 5M and 1M charts.
   It is not made or shown on 1D, 1W or 1MO charts. */
const SIG_TFS=['4h','1h','30m','15m','5m','1m'];
const s4Empty=()=>({ready:false,sigs:[],swings:[],last:null,raw:null,zones:[],entryZ:[],n:'',m:''});
let S4=s4Empty();
/* 1D, 1W and 1MO POIs: graded zones (A and A+) from closed HTF candles. ft = when a zone becomes usable. */
const HTF_POI_TFS=['1d','1w','1M'];
/* POI colours by timeframe: 1D blue, 1W green, 1MO yellow */
const POI_COL={'1d':'#3b82f6','1w':'#22c55e','1M':'#facc15'};
function htfPOIs(t){
 const s=series(t),arr=replayT!=null?s:s.slice(0,-1);
 if(arr.length<60)return null;
 let E=null;try{E=engine(arr,arr[arr.length-1].c,true)}catch(e){return null}
 if(!E||!E.allZ)return null;
 return{tf:t,ms:TFM[t],arr,tr:E.trend,zones:E.allZ.filter(z=>z.g!=='B'&&arr[z.from]&&arr[z.i]).map(z=>({d:z.d,lo:z.lo,hi:z.hi,g:z.g,k:z.k,ot:arr[z.i].t,ft:arr[z.from].t+TFM[t]}))};

/* a 4H swing at price p and time pt confirms when it touches a same-side POI that formed before pt
   and was not touched by any closed HTF candle between its formation and the swing */
/* A+ confluence score for a POI-touched 4H swing (max 14). A+ at 8 or more, A at 5 to 7, B below 5.
   Each point is a fact read from the chart: POI quality and timeframe, HTF trend agreement, a liquidity sweep
   with close back, an impulsive reversal candle, a volume spike, order-flow delta, session, and POI overlap. */
function swingScore(hc,s,pois,side,poi){
 const why=[];let sc=0;const add=(p,t)=>{sc+=p;why.push(t)};
 add(poi.g==='A+'?2:1,poi.g==='A+'?'A+ POI':'A POI');
 const tfPts={'1M':2,'1w':1,'1d':1};if(tfPts[poi.tf])add(tfPts[poi.tf],LBL[poi.tf]+' POI');
 const al=pois.filter(P=>P.tr===side).length;if(al)add(al,al+' HTF trend agrees');
 const i=s.i,k=hc[i];
 let prev=side===1?Infinity:-Infinity;
 for(let j=Math.max(0,i-10);j<i;j++)prev=side===1?Math.min(prev,hc[j].l):Math.max(prev,hc[j].h);
 if(side===1?(k.l<prev&&k.c>prev):(k.h>prev&&k.c<prev))add(2,'liquidity sweep and close back');
 const ci=s.c,ck=hc[ci];let ar=0,m=0;for(let j=Math.max(1,ci-14);j<ci;j++){ar+=hc[j].h-hc[j].l;m++}ar=m?ar/m:0;
 if(ar&&Math.abs(ck.c-ck.o)>1.2*ar&&(side===1?ck.c>ck.o:ck.c<ck.o))add(1,'impulsive reversal candle');

/* Trade setup for a confirmed 4H signal.
   Entry: close of the 4H candle that confirmed the swing. Stop: beyond the swing extreme plus 0.25 x ATR.
   TP1: nearest prior 4H swing that gives at least 1.5R (else 2R). TP2: next prior swing at 3R or more (else 3R).
   Outcome: walks the 4H candles after the signal. Stop first if both are hit on one candle. */
function tradePlan(hc,s){

  if(buy&&k.h>hc[j-1].h&&k.h>hc[j-2].h&&k.h>=hc[j+1].h&&k.h>=hc[j+2].h)piv.push(k.h);
  if(!buy&&k.l<hc[j-1].l&&k.l<hc[j-2].l&&k.l<=hc[j+1].l&&k.l<=hc[j+2].l)piv.push(k.l)}

 const tp2=cand.find(p=>rr(p)>=3&&Math.abs(p-entry)>1.2*Math.abs(tp1-entry))??(entry+dir*Math.max(3*risk,1.2*Math.abs(tp1-entry)));

}
function tally(list){const t={TP1:0,TP2:0,SL:0,EXIT:0,open:0};list.forEach(s=>{if(s.plan)t[s.plan.res]++});return t}
function planHTML(P){
 if(!P)return '';

function poiTouch(pois,side,p,pt){

  if(z.d!==side||z.ft>pt||p<z.lo||p>z.hi)continue;
  let hit=false;
  for(const k of P.arr){if(k.t<z.ft)continue;if(k.t+P.ms>pt)break;if(k.l<=z.hi&&k.h>=z.lo){hit=true;break}}

function calcSig4(){

  const poi=m?{tf:m.tf,k:m.z.k,g:m.z.g,lo:m.z.lo,hi:m.z.hi}:null;
  const sc=poi?swingScore(hc,s,pois,side,poi):null;

/* ---------- BACKTEST: outcome counts per sensitivity and grade, over the loaded 4H history ----------
   Runs the same signal pipeline at Low, Medium and High, with the A+ filter off, and counts each trade's result.
   Realized R: TP2 = its R, stop = -1R, exit = signed R at the exit close (half TP1 and half exit if TP1 was hit).
   Open trades (no result yet) are excluded from R. */
let SHOWBT=false,BT='';
function backtest(){
 if(!SIG_TFS.includes(tf)||src!=='api'||!MTF['4h'])return '<div class="box mu">Stats need the live feed on the 4H to 1M charts, after the 4H history loads.</div>';
 const saveSens=sens,saveS4=S4,saveAO=on.AOnly,rows=[];
 try{
  on.AOnly=0;
  for(let si=0;si<SENS.length;si++){sens=si;calcSig4();
   const list=S4.all||[];
   ['A+','A','B'].forEach(g=>{
    const L=list.filter(s=>s.grade===g&&s.plan);const n=L.length;
    if(!n){rows.push(`<div class="mu">${SENS[si].n} · ${g}: no trades</div>`);return}
    const cnt={tp1:0,tp2:0,sl:0,ex:0,open:0};let R=0,nc=0;
    L.forEach(s=>{const p=s.plan;
     if(p.res==='TP1'||p.res==='TP2'||(p.res==='EXIT'&&p.tp1Hit))cnt.tp1++;
     if(p.res==='TP2')cnt.tp2++;
     if(p.res==='SL')cnt.sl++;
     if(p.res==='EXIT')cnt.ex++;
     if(p.res==='open'||p.res==='TP1')cnt.open++;
     if(p.res==='TP2'||p.res==='SL'||p.res==='EXIT'){
      let r;
      if(p.res==='TP2')r=p.r2;else if(p.res==='SL')r=-1;
      else{const exR=p.dir*(p.exitPx-p.entry)/p.risk;r=p.tp1Hit?0.5*(p.r1+exR):exR}
      R+=r;nc++}});
    const pc=v=>Math.round(100*v/n)+'%';
    rows.push(`<div><b>${SENS[si].n}</b> · ${g} · n=${n} · reached TP1 ${pc(cnt.tp1)} · TP2 ${pc(cnt.tp2)} · stop ${pc(cnt.sl)} · exit ${pc(cnt.ex)} · open ${pc(cnt.open)} · avg R ${nc?(R/nc>=0?'+':'')+(R/nc).toFixed(2):'n/a'}</div>`);
   });
  }
 } finally{sens=saveSens;S4=saveS4;on.AOnly=saveAO}
 return `<div class="box"><b>Track record by sensitivity and grade</b> <span class="mu">(loaded history, ${LBL[tf]} chart)</span>${rows.join('')}<span class="mu">Under 20 trades per row is not meaningful. Past results do not guarantee future results.</span></div>`;
}
$('bt').onclick=()=>{SHOWBT=!SHOWBT;$('bt').classList.toggle('on',SHOWBT);BT=SHOWBT?backtest():'';info()};

/* ---------- CASCADE: sell A+ POIs, 1MO to 1m, each level inside the one above ---------- */
function engAt(t,price,memo){
 if(t in memo)return memo[t];
 const s=series(t),cl=replayT!=null?s:s.slice(0,-1);
 let r=null;if(cl.length>=60){try{r=engine(cl,price)}catch(e){console.error(e)}}
 return memo[t]=r;
}
function cascade(price){
 if(src!=='api')return null;
 const memo={},eng=t=>engAt(t,price,memo);
 let best=[],complete=false;
 const walk=(i,parent,path)=>{
  if(path.length>best.length)best=path;
  if(i===CAS_TF.length){complete=true;return true}
  const t=CAS_TF[i],E=eng(t);
  if(!E||E.trend!==-1)return false;
  const cands=E.Z.filter(z=>z.d===-1&&z.g==='A+'&&z.hi>=price&&(!parent||(z.lo<=parent.hi&&z.hi>=parent.lo)))
   .sort((u,v)=>Math.abs(u.lo-price)-Math.abs(v.lo-price));
  for(const z of cands.slice(0,3))if(walk(i+1,z,[...path,{tf:t,z,E}]))return true;
  return false;
 };
 walk(0,null,[]);
 const shown=CAS_TF.map(t=>{const hit=best.find(l=>l.tf===t);if(hit)return hit;
  const E=eng(t);if(!E)return{tf:t,none:'no data yet'};
  const cs=E.Z.filter(z=>z.d===-1&&z.g==='A+'&&z.hi>=price).sort((u,v)=>Math.abs(u.lo-price)-Math.abs(v.lo-price));
  if(!cs.length)return{tf:t,none:'no A+ sell POI'};
  return{tf:t,z:cs[0],E,off:true}});
 return{memo,levels:best,shown,complete,trade:complete?makeTrade(best,price):null,reason:complete?'':reasonFor(best,eng)};
}
function reasonFor(levels,eng){
 const top=CAS_TF[0];
 if(!levels.length){const E=eng(top);
  if(!E)return `Not enough ${LBL[top]} data yet (needs about 5 years of monthly candles).`;
  if(E.trend!==-1)return `${LBL[top]} structure is not bearish, so there is no sell chain.`;
  return `No A+ sell POI on the ${LBL[top]} above price.`}
 const prev=LBL[levels[levels.length-1].tf],next=CAS_TF[levels.length],E=eng(next);
 if(!E)return `Not enough ${LBL[next]} data yet.`;
 if(E.trend!==-1)return `${LBL[next]} structure is not bearish, so the chain stops at ${prev}.`;
 return `No A+ sell POI on the ${LBL[next]} inside the ${prev} POI, so the chain stops there.`;
}
function makeTrade(levels,price){
 const F=levels[levels.length-1],z=F.z,a=F.E.a||1,E0=levels[0].E;
 const entry=z.lo,stop=z.hi+.25*a,risk=Math.abs(entry-stop)||a;
 const rr=p=>Math.abs(p-entry)/risk;
 const tg=E0.lows.filter(p=>p<entry).sort((u,v)=>v-u);
 const tp1=tg.find(p=>rr(p)>=1.5)??entry-2*risk;
 const tp2=tg.find(p=>rr(p)>=3&&Math.abs(p-entry)>1.2*Math.abs(tp1-entry))??entry-Math.max(3.5*risk,1.5*Math.abs(tp1-entry));
 return{entry,sl:stop,tp1,tp2,r1:rr(tp1),r2:rr(tp2),inside:price>=z.lo&&price<=z.hi,past:price<=tp1};
}

 if(!CASC)return '<div class="box mu">POI cascade: loading 1MO to 1m data...</div>';
 const h=[];
 h.push('<div class="mu">Cascade: '+CAS_TF.map(t=>{const hit=CASC.levels.some(l=>l.tf===t);return `<span class="${hit?'dn':'mu'}">${LBL[t]}${hit?' ✓':''}</span>`}).join(' → ')+'</div>');
 CASC.shown.forEach(l=>{const z=l.z,E=l.E;if(!z){h.push(`<div class="mu">${LBL[l.tf]}: ${l.none}</div>`);return}
  h.push(`<div>${LBL[l.tf]} A+ sell POI ${fmt(z.lo)} – ${fmt(z.hi)}${l.off?' <span class="mu">(not in chain)</span>':''} · ${KN[z.k]} · score ${z.sc}<br><span class="mu">structure ${E.trend===-1?'bearish':'not bearish'} · liquidity ${z.liq?'taken':'not taken'} · inducement ${z.ind?'yes':'no'} · CRT ${E.crt1?(z.crtAfter?'after POI':'before POI'):'none'}</span></div>`)});

/* ---------- SELL SCANNER: runs the cascade on every feed without changing the chart ---------- */
async function scanSells(){
 const btn=$('scan');btn.disabled=true;setSt('Scanning sell POIs...');
 try{
  const datas=await Promise.all(Object.keys(FEEDS).map(async k=>({k,res:await Promise.all(CAS_TF.map(t=>fetchKlines(FEEDS[k].s,t,20)))})));
  const saved={MTF,C,tf,replayT,CASC,A,S4,src};const rows=[];
  try{
   for(const{k,res}of datas){
    if(res.some(r=>!r)){rows.push({k,err:'feed unavailable'});continue}
    const D={};CAS_TF.forEach((t,i)=>D[t]=res[i]);
    MTF=D;tf='1m';C=D['1m'];replayT=null;src='api';
    rows.push({k,r:cascade(C[C.length-1].c)});
   }
  }finally{MTF=saved.MTF;C=saved.C;tf=saved.tf;replayT=saved.replayT;CASC=saved.CASC;A=saved.A;S4=saved.S4;src=saved.src}
  const L=rows.map(o=>{const nm=FEEDS[o.k].n;
   if(o.err)return `<div class="mu">${nm}: ${o.err}</div>`;
   const r=o.r;if(!r)return `<div class="mu">${nm}: no result</div>`;
   if(!r.complete)return `<div><b>${nm}</b> <span class="mu">${r.reason}</span></div>`;
   const T=r.trade;if(T.past)return `<div><b>${nm}</b> <span class="mu">full sell chain, price already past TP1</span></div>`;
   return `<div><b class="dn">${nm} · SELL LIMIT ${fmt(T.entry)}</b> · SL ${fmt(T.sl)} · TP1 ${fmt(T.tp1)} (${T.r1.toFixed(1)}R) · TP2 ${fmt(T.tp2)} (${T.r2.toFixed(1)}R)</div>`}).join('');
  SCAN=`<div class="box"><b>Sell POI scanner</b> <span class="mu">${new Date().toLocaleTimeString()}</span>${L}</div>`;
  setSt('Scan done');info();
 }finally{btn.disabled=false}
}

  bm=Math.max(1,Math.round(d[d.length>>1]/6e4));BASE=out;src='csv';live=false;$('lv').classList.remove('on');label=f.name.replace(/\.\w+$/,'');$('sym').textContent='CSV · '+label;
  tf=Object.keys(TFM).find(k=>TFM[k]/6e4>=bm)||'1d';markTf();loadData()};

/* pointer: drag = pan, wheel / pinch = zoom, long-press (touch) or hover (mouse) = crosshair. Works on both panels. */
const ptr=new Map();let pinch=0,pv0=100,lpT=null,lpS=null,ct=false;
const setCross=(cx,cy,el)=>{const r=el.getBoundingClientRect();cross={x:cx-r.left,y:cy-r.top,el}};
function bindPtr(el){
 el.onpointerleave=e=>{if(e.pointerType==='mouse'){cross=null;draw()}};
 el.onpointerdown=e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});el.setPointerCapture(e.pointerId);
  if(ptr.size===1&&e.pointerType==='touch'){lpS={x:e.clientX,y:e.clientY};clearTimeout(lpT);lpT=setTimeout(()=>{ct=true;setCross(lpS.x,lpS.y,el);draw()},380)}
  if(ptr.size===2){clearTimeout(lpT);ct=false;cross=null;const p=[...ptr.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);pv0=vis}};
 el.onpointermove=e=>{
  if(e.pointerType==='mouse'&&!ptr.has(e.pointerId)){setCross(e.clientX,e.clientY,el);draw();return}
  if(!ptr.has(e.pointerId))return;const pv=ptr.get(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ct){setCross(e.clientX,e.clientY,el);draw();return}
  if(lpS&&Math.hypot(e.clientX-lpS.x,e.clientY-lpS.y)>8){clearTimeout(lpT);lpS=null}
  cross=null;
  if(ptr.size===2&&pinch){const p=[...ptr.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(d>0)vis=clamp(Math.round(pv0*pinch/d),20,300);draw();return}
  if(ptr.size!==1)return;
  off=clamp(off+(e.clientX-pv.x)/V.cw,-15,Math.max(0,C.length-20));
  if(el===cv)pshift+=(e.clientY-pv.y)*((V.mx-V.mn)/Math.max(1,V.B));
  draw()};
 const pup=e=>{clearTimeout(lpT);lpS=null;if(ct){ct=false;cross=null;draw()}ptr.delete(e.pointerId);if(ptr.size<2)pinch=0};
 el.onpointerup=pup;el.onpointercancel=pup;el.ondblclick=()=>{pshift=0;off=0;draw()};
 el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect(),mx=e.clientX-r.left,R=Wd-62;if(mx>R)return;
  const ov=vis;vis=clamp(Math.round(vis*(e.deltaY>0?1.15:.85)),20,300);off=clamp(off+(ov-vis)*(.5-mx/R),-15,Math.max(0,C.length-20));draw()},{passive:false});
}
bindPtr(cv);bindPtr(lc);
addEventListener('resize',size);size();setInterval(()=>{if(!ptr.size)draw()},1000);
markTf();
loadData();
